<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <!-- Blue rounded square background -->
  <rect width="40" height="40" rx="9" fill="#006BFF"/>

  <!-- Plate outer ring -->
  <circle cx="20" cy="20" r="11" stroke="white" stroke-width="2.2" fill="none"/>
  <!-- Plate inner ring -->
  <circle cx="20" cy="20" r="7" stroke="white" stroke-width="1.4" fill="none" opacity="0.5"/>

  <!-- Fork stem -->
  <line x1="8" y1="10" x2="8" y2="30" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Fork tines (left, center, right) -->
  <line x1="6.2" y1="10" x2="6.2" y2="15" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="9.8" y1="10" x2="9.8" y2="15" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Fork tine bridge -->
  <path d="M6.2 15 Q8 16.5 9.8 15" stroke="white" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Knife -->
  <line x1="32" y1="17" x2="32" y2="30" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Knife blade -->
  <path d="M32 10 C32 10 34 13 34 16.5 C34 17.5 33 17 32 17" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
